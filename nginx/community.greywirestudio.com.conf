# Greywire community site, installed as
# /etc/nginx/conf.d/community.greywirestudio.com.conf. It serves the same
# frontend build as prosaurus.com (the app switches to Greywire mode by
# hostname) and proxies to the same backend container, which tells the sites
# apart by the Host header.
#
# The certificate comes from certbot's webroot method (see the holding config),
# so renewals keep working through the acme-challenge location below.
server {
    listen 80;
    server_name community.greywirestudio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/community.greywirestudio.com;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name community.greywirestudio.com;

    ssl_certificate /etc/letsencrypt/live/community.greywirestudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/community.greywirestudio.com/privkey.pem;

    # Same build as prosaurus.com
    root /var/www/prosaurus.com;
    index index.html;

    client_max_body_size 100m;

    # API proxy to backend container
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO - WebSocket support
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files redirect to S3
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend SPA - serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
