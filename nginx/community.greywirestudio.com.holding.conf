# Holding config for community.greywirestudio.com, installed as
# /etc/nginx/conf.d/community.greywirestudio.com.conf until the Greywire
# community code is deployed. It answers certbot's HTTP check from
# /var/www/community.greywirestudio.com and sends everyone else to the brand
# site. Replace it with community.greywirestudio.com.conf at deploy time.
server {
    listen 80;
    server_name community.greywirestudio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/community.greywirestudio.com;
    }

    location / {
        return 302 https://greywirestudio.com/;
    }
}
